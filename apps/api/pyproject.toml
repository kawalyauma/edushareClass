[project]
name = "edushareclass-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3",
  "psycopg[binary]>=3.2,<4", "PyJWT>=2.9,<3", "argon2-cffi>=23,<26",
  "python-multipart>=0.0.9,<1", "pydantic>=2,<3", "email-validator>=2,<3", "alembic>=1.13,<2"
]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
